<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground – Lingua</title>
    <link rel="stylesheet" href="playground.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-mark">λ</span>Lingua</a>
      <h1 class="sr-only">Lingua playground</h1>
      <div class="file">
        <label class="sr-only" for="title">Program name</label>
        <input
          id="title"
          class="file-name"
          type="text"
          value="fibonacci"
          spellcheck="false"
        />
        <span class="file-status">Saved</span>
      </div>
      <nav class="links">
        <a href="#">Examples</a>
        <a href="#">Docs</a>
        <a href="#">Log in</a>
      </nav>
      <div class="actions">
        <button class="btn" type="button">Share</button>
        <button class="btn" type="button">Save</button>
        <button class="btn btn-primary" type="button">
          Run <kbd>Ctrl ↵</kbd>
        </button>
      </div>
    </header>

    <aside class="sidebar">
      <details open>
        <summary>Examples</summary>
        <ul class="list">
          <li><a href="#">Hello world</a></li>
          <li><a href="#">FizzBuzz</a></li>
          <li>
            <a class="is-active" href="#" aria-current="page">Fibonacci</a>
          </li>
          <li><a href="#">Factorial</a></li>
        </ul>
      </details>
      <details open>
        <summary>Versions</summary>
        <ul class="list">
          <li>
            <a class="is-active" href="#">v3<span class="meta">now</span></a>
          </li>
          <li>
            <a href="#">v2<span class="meta">12 min ago</span></a>
          </li>
          <li>
            <a href="#">v1<span class="meta">1 hour ago</span></a>
          </li>
        </ul>
      </details>
      <details open>
        <summary>Recent runs</summary>
        <ul class="list runs">
          <li>
            <span class="dot ok"></span>3 ms<span class="meta">just now</span>
          </li>
          <li>
            <span class="dot fail"></span>Syntax error<span class="meta"
              >4 min ago</span
            >
          </li>
          <li>
            <span class="dot ok"></span>5 ms<span class="meta">9 min ago</span>
          </li>
        </ul>
      </details>
    </aside>
  </body>
</html>
